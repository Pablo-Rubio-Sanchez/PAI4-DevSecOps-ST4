name: DevSecOps Pipeline - PAI4

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-static-analysis:
    name: Build, SAST & SCA (Opción A)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 1. SAST - Análisis estático del código fuente con Semgrep
      - name: SAST - Semgrep Scan (Quality Gate 1 - Aviso)
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/owasp-top-ten \
            --severity=ERROR \
            --severity=WARNING \
            --error \
            --metrics=off \
            --json \
            --output=/src/semgrep-report.json \
            /src

      # 2. SCA - Análisis de dependencias con Snyk
      - name: Instalar Snyk CLI
        uses: snyk/actions/setup@master

      - name: SCA - Snyk Dependency Scan (Quality Gate 1 - Aviso)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps
          snyk test --severity-threshold=high --json-file-output=snyk-report.json

      # 3. Subida de informes como Artifacts para Opción B y Opción C (DefectDojo)
      - name: Subir informes SAST y SCA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            semgrep-report.json
            snyk-report.json
          if-no-files-found: warn

  iac-and-dast-analysis:
    name: IaC, Staging & DAST (Opción B)
    runs-on: ubuntu-latest
    needs: build-and-static-analysis

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 1. IaC - Análisis de Dockerfile y Terraform con Trivy (Modo aviso)
      - name: IaC - Trivy Config Scan (Modo Aviso)
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            aquasec/trivy:latest config \
            --severity CRITICAL,HIGH,MEDIUM \
            --exit-code 1 \
            --format json \
            --output /workspace/trivy-report.json \
            /workspace

      # 2. Despliegue temporal (Staging) de OWASP Juice Shop
      - name: Desplegar OWASP Juice Shop en Staging (localhost:3000)
        run: |
          docker run -d --name juice-shop -p 3000:3000 bkimminich/juice-shop:latest
          echo "Esperando a que Juice Shop arranque..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "¡Juice Shop operativo en http://localhost:3000!"
              break
            fi
            sleep 2
          done

      # 3. DAST - Escaneo dinámico con OWASP ZAP + Quality Gate 2 (Bloqueante)
      - name: DAST - OWASP ZAP Scan (Quality Gate 2 - Bloqueante)
        continue-on-error: false
        run: |
          chmod 777 "${{ github.workspace }}"
          docker run --rm --network="host" \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:3000 \
            -x zap-report.xml \
            -r zap-report.html

      # 4. Subida de informes IaC y DAST como Artifacts para Opción C (DefectDojo)
      - name: Subir informes IaC y DAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-and-iac-reports
          path: |
            trivy-report.json
            zap-report.xml
            zap-report.html
          if-no-files-found: warn

name: DevSecOps Pipeline - PAI4

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # =========================================================
  # ETAPA 1: BUILD Y ANÁLISIS ESTÁTICO / IaC (EN PARALELO)
  # =========================================================

  # 1A. SAST - Análisis estático del código fuente con Semgrep (Compañero A)
  sast-semgrep:
    name: "SAST: Semgrep"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: SAST - Semgrep Scan (Modo Aviso)
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/owasp-top-ten \
            --severity=ERROR \
            --severity=WARNING \
            --error \
            --metrics=off \
            --json \
            --output=/src/semgrep-report.json \
            /src

      - name: Subir informe SAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: warn

  # 1B. SCA - Análisis de dependencias con Snyk (Compañero A)
  sca-snyk:
    name: "SCA: Snyk"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Snyk CLI
        uses: snyk/actions/setup@master

      - name: SCA - Snyk Dependency Scan (Modo Aviso)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps
          snyk test --severity-threshold=high --json-file-output=snyk-report.json

      - name: Subir informe SCA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: snyk-report.json
          if-no-files-found: warn

  # 1C. IaC - Análisis de Dockerfile y Terraform con Trivy (Tu Bloque B)
  iac-trivy:
    name: "IaC: Trivy"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: IaC - Trivy Config Scan (Modo Aviso)
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            aquasec/trivy:latest config \
            --severity CRITICAL,HIGH,MEDIUM \
            --exit-code 1 \
            --format json \
            --output /workspace/trivy-report.json \
            /workspace

      - name: Subir informe IaC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: warn

  # 1D. Build - Construcción y verificación de imagen Docker (Tu Bloque B)
  build-image:
    name: "Build: Docker Image"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Construir imagen Docker de OWASP Juice Shop
        run: |
          docker build -t juice-shop-local:staging .

  # =========================================================
  # GATEWAY 1: QUALITY GATE A (MODO AVISO)
  # =========================================================
  quality-gate-a:
    name: "Quality Gate A (Modo Aviso)"
    runs-on: ubuntu-latest
    needs: [sast-semgrep, sca-snyk, iac-trivy, build-image]
    if: always()
    steps:
      - name: Descargar informes estáticos e IaC
        uses: actions/download-artifact@v4

      - name: Evaluar umbral >= 1 Crítica/Alta (Modo Aviso)
        run: |
          echo "=== QUALITY GATE A: MODO AVISO ==="
          echo "⚠️ Quality Gate A en Modo Aviso: hallazgos críticos/altos detectados en análisis estático e IaC."
          echo "El pipeline continúa hacia la etapa de Staging y Análisis Dinámico sin bloquear."

  # =========================================================
  # ETAPA 2: STAGING Y ANÁLISIS DINÁMICO DAST (TU BLOQUE B)
  # =========================================================
  staging-dast:
    name: "Staging y DAST: OWASP ZAP"
    runs-on: ubuntu-latest
    needs: quality-gate-a
    steps:
      - name: Desplegar OWASP Juice Shop en Staging (localhost:3000)
        run: |
          docker run -d --name juice-shop -p 3000:3000 bkimminich/juice-shop:latest
          echo "Esperando a que Juice Shop arranque..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "¡Juice Shop operativo en http://localhost:3000!"
              break
            fi
            sleep 2
          done

      - name: DAST - Escaneo dinámico con OWASP ZAP
        continue-on-error: true
        run: |
          chmod 777 "${{ github.workspace }}"
          docker run --rm --network="host" \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:3000 \
            -x zap-report.xml \
            -r zap-report.html

      - name: Subir informes DAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            zap-report.xml
            zap-report.html
          if-no-files-found: warn

  # =========================================================
  # GATEWAY 2: QUALITY GATE B (MODO BLOQUEANTE - TU BLOQUE B)
  # =========================================================
  quality-gate-b:
    name: "Quality Gate B (Bloqueante)"
    runs-on: ubuntu-latest
    needs: staging-dast
    steps:
      - name: Descargar informe DAST
        uses: actions/download-artifact@v4
        with:
          name: zap-report

      - name: Evaluar umbral DAST (Bloqueante)
        continue-on-error: false
        run: |
          echo "=== QUALITY GATE B: MODO BLOQUEANTE ==="
          if grep -q "<riskcode>[23]</riskcode>" zap-report.xml; then
            echo "❌ BLOQUEO DE SEGURIDAD: OWASP ZAP ha detectado vulnerabilidades por encima del umbral."
            echo "⛔ Pipeline detenido: Se bloquea el paso a Etapa 3 (Producción)."
            exit 1
          else
            echo "✅ APROBADO: Sin vulnerabilidades por encima del umbral. Listo para Producción."
            exit 0
          fi

name: DevSecOps Pipeline - PAI4

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # OPCIÓN A: Análisis Estático (SAST + SCA)

  # 1A. SAST - Análisis estático del código fuente con Semgrep
  sast-semgrep:
    name: "SAST: Semgrep"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: SAST - Semgrep Scan (Modo Aviso)
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/owasp-top-ten \
            --severity=ERROR \
            --severity=WARNING \
            --error \
            --metrics=off \
            --json \
            --output=/src/semgrep-report.json \
            /src

      - name: Subir informe SAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: warn

  # 1B. SCA - Análisis de dependencias con Snyk
  sca-snyk:
    name: "SCA: Snyk"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Snyk CLI
        uses: snyk/actions/setup@master

      - name: SCA - Snyk Dependency Scan (Modo Aviso)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps
          snyk test --severity-threshold=high --json-file-output=snyk-report.json

      - name: Subir informe SCA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: snyk-report.json
          if-no-files-found: warn

  # GATEWAY 1: Quality Gate A (Modo Aviso - Umbral: >= 1 Crítica/Alta)
  quality-gate-a:
    name: "Quality Gate A (Modo Aviso)"
    runs-on: ubuntu-latest
    needs: [sast-semgrep, sca-snyk] # Opción B añadirá aquí build-image e iac-trivy
    if: always()

    steps:
      - name: Evaluar umbral >= 1 Crítica/Alta (Modo Aviso)
        run: |
          echo "⚠️ Quality Gate A en Modo Aviso: hallazgos críticos/altos detectados en análisis estático."
          echo "El pipeline continúa hacia la etapa de Staging y Análisis Dinámico sin bloquear."

  # OPCIÓN B: IaC, Staging & DAST
  iac-and-dast-analysis:
    name: IaC, Staging & DAST (Opción B)
    runs-on: ubuntu-latest
    needs: quality-gate-a

    steps:
      # 1. IaC - Análisis de Dockerfile y Terraform con Trivy (Modo aviso)
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: IaC - Trivy Config Scan (Modo Aviso)
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            aquasec/trivy:latest config \
            --severity CRITICAL,HIGH,MEDIUM \
            --exit-code 1 \
            --format json \
            --output /workspace/trivy-report.json \
            /workspace

      # 2. Despliegue temporal (Staging) de OWASP Juice Shop
      - name: Desplegar OWASP Juice Shop en Staging (localhost:3000)
        run: |
          docker run -d --name juice-shop -p 3000:3000 bkimminich/juice-shop:latest
          echo "Esperando a que Juice Shop arranque..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "¡Juice Shop operativo en http://localhost:3000!"
              break
            fi
            sleep 2
          done

      # 3. DAST - Escaneo dinámico con OWASP ZAP + Quality Gate 2 (Bloqueante)
      - name: DAST - OWASP ZAP Scan (Quality Gate 2 - Bloqueante)
        continue-on-error: false
        run: |
          chmod 777 "${{ github.workspace }}"
          docker run --rm --network="host" \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:3000 \
            -x zap-report.xml \
            -r zap-report.html

      # 4. Subida de informes IaC y DAST como Artifacts para Opción C (DefectDojo)
      - name: Subir informes IaC y DAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-and-iac-reports
          path: |
            trivy-report.json
            zap-report.xml
            zap-report.html
          if-no-files-found: warn
